  <div class="chatbot-main">
    <div class="chatbot-message chatbot-message__bot">
      <p class="govuk-body">Tell me how I can help.</p>
    </div>
    <div class="chatbot-message chatbot-message__human">
      <p class="govuk-body">I'm not really sure what I should do first.
        What do you think I should start with?</p>
    </div>
    <div class="chatbot-main__input">
      <label class="govuk-visually-hidden" for="ChatbotInput">
        Enter chatbot message
      </label>
      <textarea class="govuk-textarea" id="ChatbotInput" name="ChatbotInput" rows="3" aria-describedby="ChatbotInput"></textarea>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var toggleChatBot = document.getElementById("chatBotContainer");
    var chatbotClose = document.getElementById("chatbotClose");


    if (!toggleChatBot || !chatbotClose) {
      alert("Cannot find Chatbot container")
      return;
    }

    toggleChatBot.addEventListener("click", function () {
      toggleChatBot.classList.remove("chatbot-container__small");
      event.stopPropagation()
    });

    chatbotClose.addEventListener("click", function () {
      toggleChatBot.classList.add("chatbot-container__small");
      event.stopPropagation()
    });

  });
</script>
